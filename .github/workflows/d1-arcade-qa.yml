name: D1 Arcade browser QA

on:
  push:
    branches: [revamp/milestone-d1-arcade]
    paths:
      - 'src/revamp/arcade.js'
      - 'src/styles/revamp/arcade.css'
      - 'public/art/arcade/**'
      - 'index.html'
      - 'src/main.js'
      - 'src/progress/**'
      - 'scripts/d1-arcade-qa.mjs'
      - '.github/workflows/d1-arcade-qa.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/brainpower-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/brainpower-server.log
          exit 1
      - name: Run D1 browser QA
        run: node scripts/d1-arcade-qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-d1-arcade-qa
          path: qa-d1-arcade/
          retention-days: 14
