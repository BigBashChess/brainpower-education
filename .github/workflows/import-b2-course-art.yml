name: Import B2 course hero art

on:
  push:
    branches: [revamp/milestone-b2-courses]
    paths:
      - '.github/workflows/import-b2-course-art.yml'

permissions:
  contents: write

jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/milestone-b2-courses
      - name: Install WebP encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
      - name: Download and compress approved course heroes
        env:
          M12: "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/d58e363c-fe63-4f10-934c-76edd160c47f/910b04ce-7671-4461-8669-4adfd0e826d4/A_single_standalone_ultra_wide_cinematic_hero_illustration_f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMmUyMjY0MzY1YTc5MTY0ZSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTAyMDIxNH0.5KyGiYwTSBNAZzQ6PdXtQVmhSOfAsS2jWZGIfQn9HiM"
          M34: "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/485ad00e-0d91-4b48-99ba-d25858436403/96cbdb36-b1a8-4d8a-96c5-e38a24706bf2/A_single_standalone_ultra_wide_cinematic_hero_illustration_f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2ZlYWUwNGYxZmY0NTliNyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA4MTY3OX0.E3s3n9J4d-8eZ3L6Q2e7GvLAdPtQxVpJtyrMQuobVFI"
          S12: "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/439e5c39-920d-4029-9b4a-ac4a61f48412/df566122-4f50-4c4a-8557-f9ea9ce1fdea/A_single_standalone_ultra_wide_cinematic_hero_illustration_f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODM2ODU3MTkzNGY5MmU3OSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA1NjUzN30.ne41z0vsTyNLKCiW9nNYrmIF2JqrFdhb3hNb36BLrOM"
          S34: "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/72b87e83-0508-4084-b483-96e36fb9be56/5dc91cd1-37b5-4f09-9bd9-d8c4e2bb02f5/A_single_standalone_ultra_wide_cinematic_hero_illustration_f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTI0MTU4NWQ5OTVmN2ViYyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA2Nzk5N30.75xggjnYq4Mf0VsUrjK8WJ6kaVYEnYGFt0jaolBmvBo"
          P12: "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/153aae3b-427a-42cc-b126-f5341f1c3184/02a0ac8d-bcab-4187-ba6b-f629e7b4612b/A_single_standalone_ultra_wide_cinematic_hero_illustration_f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjAxYzg3NjljOGQ0ZWYwMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA3MzUxM30.4OCoyXfz9oZ0wYtHDCQodpM0qryrBY_MUfcgNDilKq4"
        run: |
          set -euo pipefail
          mkdir -p public/art/courses /tmp/bp-course-art
          curl -fsSL "$M12" -o /tmp/bp-course-art/methods-12.png
          curl -fsSL "$M34" -o /tmp/bp-course-art/methods-34.png
          curl -fsSL "$S12" -o /tmp/bp-course-art/specialist-12.png
          curl -fsSL "$S34" -o /tmp/bp-course-art/specialist-34.png
          curl -fsSL "$P12" -o /tmp/bp-course-art/physics-12.png
          for name in methods-12 methods-34 specialist-12 specialist-34 physics-12; do
            cwebp -quiet -q 80 -resize 2400 0 "/tmp/bp-course-art/$name.png" -o "public/art/courses/$name-hero.webp"
          done
          ls -lh public/art/courses/
      - name: Commit production artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art/courses/*.webp
          git commit -m "Add production B2 course hero artwork"
          git push origin HEAD:revamp/milestone-b2-courses
