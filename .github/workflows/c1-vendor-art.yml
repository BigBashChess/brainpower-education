name: C1 vendor assessment art

on:
  push:
    branches: [revamp/milestone-c1-assessment]
    paths: ['.github/workflows/c1-vendor-art.yml']

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/milestone-c1-assessment
      - name: Download generated hero
        run: |
          mkdir -p public/art/assessment
          curl -fL 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/a4aae734-3aba-46f6-b63c-17f5094840c1/0eb1a09d-9c09-4363-8540-3aa2d37ede3e/A_single_wide_premium_illustrated_educational_environment_fo.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDhkYmRjNzI1NDUxNGM1OCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA1MzE3MH0.jrPf7P-j4RLz1iZF6I8Vu8d0dp_gSGWMLCw9jy00r_U' -o /tmp/test-centre-hero.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/test-centre-hero.png').convert('RGB')
          im.thumbnail((2400,1200),Image.Resampling.LANCZOS)
          im.save('public/art/assessment/test-centre-hero.webp','WEBP',quality=82,method=6)
          print(im.size)
          PY
          ls -lh public/art/assessment/test-centre-hero.webp
      - name: Commit permanent local asset
        run: |
          git config user.name 'Brainpower Build'
          git config user.email 'actions@users.noreply.github.com'
          git add public/art/assessment/test-centre-hero.webp
          git commit -m 'Vendor Test Centre hero artwork'
          git push origin HEAD:revamp/milestone-c1-assessment
