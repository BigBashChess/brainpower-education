name: Vendor C2 hero art

on:
  push:
    branches: [revamp/milestone-c2-resources-tools]
    paths: ['.github/workflows/vendor-c2-art.yml']

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/milestone-c2-resources-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download and compress approved C2 art
        env:
          RESOURCES_URL: "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/32d75d6e-dc20-4014-b32f-6592818238a7/ae88ae25-5aa5-470f-ab32-bbb5def0225e/Create_a_single_standalone_ultra_wide_cinematic_website_hero.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTA3MTQyZWQzNjBkNWZmMCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE0MzY2MX0.kDy_nHmR1pbM7hsAZLhRb_5jYdD1EbOhEGXfIcYCXq4"
          TOOLS_URL: "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/49e1959c-561a-4d62-bade-2f28c2125830/0ba60f3d-fb4e-4d7d-958b-ddc6fe6bbe19/Create_a_single_standalone_ultra_wide_cinematic_website_hero.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTk1ZDdmY2UzMmYzOTE5MyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTEwOTk2Nn0.BtHJ3juLS1MoFpmBrbfaxqrKgHDCSXEuaWmkHe8wE1U"
        run: |
          mkdir -p public/art/resources public/art/tools /tmp/c2
          curl -fL "$RESOURCES_URL" -o /tmp/c2/resources.png
          curl -fL "$TOOLS_URL" -o /tmp/c2/tools.png
          python - <<'PY'
          from PIL import Image
          for src,dst in [('/tmp/c2/resources.png','public/art/resources/resources-hero.webp'),('/tmp/c2/tools.png','public/art/tools/tools-hero.webp')]:
              im=Image.open(src).convert('RGB')
              im.save(dst,'WEBP',quality=82,method=6)
              print(dst, im.size)
          PY
      - name: Commit permanent local assets
        run: |
          git config user.name "Brainpower Build"
          git config user.email "actions@users.noreply.github.com"
          git add public/art/resources/resources-hero.webp public/art/tools/tools-hero.webp
          git commit -m "Vendor C2 Resources and Tools hero artwork"
          git push
