name: Milestone E final quality gate

on:
  push:
    branches: [revamp/milestone-e-final-qa, revamp/release-1-0-1, revamp/pre1-finalisation, revamp/daily-progress-v1, revamp/v1-live-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run final static audit
        run: node scripts/e-static-audit.mjs
      - name: Run existing revamp smoke
        run: node scripts/revamp-smoke.mjs

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/brainpower-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/brainpower-server.log
          exit 1
      - name: Run full-site browser regression
        run: |
          node scripts/e-final-qa.mjs
      - name: Check finalisation states, accessibility and performance
        if: always()
        run: node scripts/finalisation-qa.mjs
      - name: Check Daily saving and recent question activity
        if: always()
        run: node scripts/daily-progress-qa.mjs
      - name: Check all functional flows and motion stability
        if: always()
        run: |
          failed=0
          for suite in b2-course b3-lesson b4-practice c1-assessment c2-resources-tools c3-progress d2-secondary d1-arcade d3-motion; do
            node "scripts/${suite}-qa.mjs" || failed=1
          done
          exit "$failed"
      - name: Upload final QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-e-final-qa
          path: |
            qa-daily/
            qa-e-final/
            qa-finalisation/
            qa-d1-arcade/
            qa-d3-motion/
          if-no-files-found: warn
          retention-days: 21
