name: C3 Progress browser QA

on:
  push:
    branches: [revamp/milestone-c2-resources-tools]
    paths:
      - 'src/revamp/progress.js'
      - 'src/styles/revamp/progress.css'
      - 'public/art/progress/**'
      - 'src/revamp/runtime.js'
      - 'src/pages.js'
      - 'src/main.js'
      - 'src/progress/**'
      - 'scripts/c3-progress-qa.mjs'
      - '.github/workflows/c3-progress-qa.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/brainpower-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/brainpower-server.log
          exit 1
      - name: Run C3 browser QA
        run: node scripts/c3-progress-qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-c3-progress-qa
          path: qa-c3-progress/
          retention-days: 14
