name: D3 Brainy and motion browser QA

on:
  push:
    branches:
      - revamp/milestone-d3-brainy-motion
    paths:
      - 'src/revamp/motion.js'
      - 'src/revamp/page-transitions.js'
      - 'src/styles/revamp/motion.css'
      - 'index.html'
      - 'scripts/d3-motion-qa.mjs'
      - '.github/workflows/d3-motion-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/brainpower-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/brainpower-server.log
          exit 1
      - name: Run D3 browser QA
        run: node scripts/d3-motion-qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-d3-motion-qa
          path: qa-d3-motion/
          retention-days: 14
