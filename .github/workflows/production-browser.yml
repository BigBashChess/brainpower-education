name: Production browser verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify deployed pages
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: node scripts/production-browser-qa.mjs
      - name: Verify published assessment and PDF download
        env:
          SITE_URL: https://bigbashchess.github.io/brainpower-education/
          QA_OUT: qa-production/assessment
        run: node scripts/assessment-addition-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-evidence
          path: qa-production/
          retention-days: 21
