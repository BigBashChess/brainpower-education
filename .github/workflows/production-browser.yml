name: Production browser verification

on:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]

permissions:
  contents: read

jobs:
  live-browser:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify deployed pages
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/production-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-evidence
          path: qa-production/
          retention-days: 21
