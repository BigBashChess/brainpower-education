name: Vendor C3 progress art

on:
  push:
    branches: [revamp/milestone-c2-resources-tools]
    paths: ['.github/workflows/vendor-c3-art.yml']

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/milestone-c2-resources-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download and compress approved C3 art
        env:
          PROGRESS_URL: "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/bb2c2fa0-d309-45e5-ad6c-e0b270d2dc44/ad2c332f-9612-45cf-802e-04b2b134160b/Create_a_single_standalone_ultra_wide_cinematic_website_hero.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2Y5YjhjNGQwMjIwZjIzNyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE1MzIyOX0.OqX7lIy711JybI2uvK45EuXjvtKlgaE4_nZjWFgDMjs"
        run: |
          mkdir -p public/art/progress /tmp/c3
          curl -fL "$PROGRESS_URL" -o /tmp/c3/progress.png
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/c3/progress.png').convert('RGB')
          im.save('public/art/progress/progress-hero.webp','WEBP',quality=82,method=6)
          print('public/art/progress/progress-hero.webp', im.size)
          PY
      - name: Commit permanent local asset
        run: |
          git config user.name "Brainpower Build"
          git config user.email "actions@users.noreply.github.com"
          git add public/art/progress/progress-hero.webp
          git commit -m "Vendor C3 Progress hero artwork"
          git push
