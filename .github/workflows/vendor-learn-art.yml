name: Vendor Learn hero artwork

on:
  push:
    branches: [revamp/milestone-b1-learn]
    paths:
      - '.github/workflows/vendor-learn-art.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download approved Learn hero
        run: |
          mkdir -p /tmp/bp-learn-art public/art/learn
          curl -fL --retry 3 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/332be6f6-1876-4baf-bd0e-6acbb6eba79f/735b1f9d-ea97-43f2-a6fb-442cc70d95ba/A_single_ultra_wide_cinematic_website_hero_background_for_Br.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzJiOTZlMjE4MWM2NWNkMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA0NzQ1N30.xFvsU-iNWuMU3ET7FV-6X0H6HveGfOY893SCZmGomSw' -o /tmp/bp-learn-art/learn.png
      - name: Compress to production WebP
        run: |
          if command -v magick >/dev/null; then IMG=magick; elif command -v convert >/dev/null; then IMG=convert; else sudo apt-get update && sudo apt-get install -y imagemagick && IMG=convert; fi
          $IMG /tmp/bp-learn-art/learn.png -resize '2600x2600>' -strip -quality 84 -define webp:method=6 public/art/learn/learn-hero.webp
          ls -lh public/art/learn/learn-hero.webp
      - name: Commit production artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/art/learn/learn-hero.webp
          git commit -m 'Add generated Learn hero artwork'
          git push
