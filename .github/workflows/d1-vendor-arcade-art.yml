name: Vendor D1 Arcade hero artwork

on:
  push:
    branches:
      - revamp/milestone-d1-arcade
    paths:
      - .github/workflows/d1-vendor-arcade-art.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/milestone-d1-arcade
      - name: Install WebP encoder
        run: |
          if ! command -v cwebp >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y webp
          fi
      - name: Download and compress approved Arcade hero
        env:
          ARCADE_HERO_URL: "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/3797db77-9ba1-4ef2-afc3-096c6b497c55/53ddde30-1cd0-4424-98c4-278b4a806f3c/Create_one_standalone_ultra_wide_cinematic_hero_background_f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDc2N2MxMWIxYTM2YTY4ZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE1NTM1NX0.DBBU3JkIAh8C029CTfInZI22iNUDAyblmt2eDAHVdV8"
        run: |
          mkdir -p public/art/arcade
          curl -L --fail --retry 3 "$ARCADE_HERO_URL" -o /tmp/brainpower-arcade-hero.png
          cwebp -quiet -q 82 /tmp/brainpower-arcade-hero.png -o public/art/arcade/hero-arcade.webp
          ls -lh public/art/arcade/hero-arcade.webp
      - name: Commit production asset
        run: |
          git config user.name "Brainpower Build"
          git config user.email "actions@users.noreply.github.com"
          git add public/art/arcade/hero-arcade.webp
          if git diff --cached --quiet; then
            echo "Arcade artwork already vendored."
            exit 0
          fi
          git commit -m "Vendor D1 Arcade hero artwork"
          git push origin HEAD:revamp/milestone-d1-arcade
