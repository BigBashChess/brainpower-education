name: Vendor approved Home artwork

on:
  push:
    branches: [revamp/milestone-a]
    paths:
      - '.github/workflows/vendor-home-art.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Skip when artwork is already local
        id: existing
        run: |
          if test -f public/art/home/hero-study-room.webp && \
             test -f public/art/home/methods-gateway.webp && \
             test -f public/art/home/specialist-gateway.webp && \
             test -f public/art/home/physics-gateway.webp; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download approved generation masters
        if: steps.existing.outputs.ready != 'true'
        run: |
          mkdir -p /tmp/bp-home-art public/art/home
          curl -fL --retry 3 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/a16bd776-1b8a-494b-a4aa-ac8e077dbc48/5f8b0a8d-3508-41e1-89f4-05425aa98df4/ONE_standalone_wide_website_hero_BACKGROUND_ARTWORK_ONLY__no.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTBmOTRjMjQ0ZWVlYWE2ZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA3MTAxMn0.g0x-xfqBhtMI3iZOxKN8CXY9Tljc391aicaCRxsbdMM' -o /tmp/bp-home-art/hero.png
          curl -fL --retry 3 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/9b468cee-4eac-4574-989a-2a4a5b167761/54f185ec-2162-4afb-9d93-3e7312e83226/Standalone_horizontal_course_card_BACKGROUND_ARTWORK_ONLY__n.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjFhYTZiNGNlYjkzY2QzYiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA1Njg0NH0.nGQS0pSiJeW0OP9GxjV6Y8UALGztlo-IJc8GlGdJDDM' -o /tmp/bp-home-art/methods.jpg
          curl -fL --retry 3 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/39bbf60e-e03a-4190-9933-4dec3a333427/d69e6f78-8f2c-422b-a8e6-fe9cd6a3f0a7/Standalone_horizontal_course_card_BACKGROUND_ARTWORK_ONLY__n.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzY5MmM0NTA5NDcwMjRiMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA4MTY4MH0.4fAHkrv93Ai7_HnZFAKAbOhbrg6BGFOiTvp4UND4WXY' -o /tmp/bp-home-art/specialist.jpg
          curl -fL --retry 3 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/98fdc8e1-c882-4f74-9186-8d3897d2facf/88a2a73e-e4bd-4663-a754-f928c904e881/Standalone_horizontal_course_card_BACKGROUND_ARTWORK_ONLY__n.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDgwOTA5M2QyN2E2Yzc5NiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA2Mjg0NX0.Np-7Q_deYSWDOv22lm2WOaI1Uypp5Dnloi1E_4-ZFD8' -o /tmp/bp-home-art/physics.jpg
      - name: Compress to production WebP
        if: steps.existing.outputs.ready != 'true'
        run: |
          if command -v magick >/dev/null; then IMG=magick; elif command -v convert >/dev/null; then IMG=convert; else sudo apt-get update && sudo apt-get install -y imagemagick && IMG=convert; fi
          $IMG /tmp/bp-home-art/hero.png -resize '2400x2400>' -strip -quality 82 -define webp:method=6 public/art/home/hero-study-room.webp
          $IMG /tmp/bp-home-art/methods.jpg -resize '1200x1200>' -strip -quality 82 -define webp:method=6 public/art/home/methods-gateway.webp
          $IMG /tmp/bp-home-art/specialist.jpg -resize '1200x1200>' -strip -quality 82 -define webp:method=6 public/art/home/specialist-gateway.webp
          $IMG /tmp/bp-home-art/physics.jpg -resize '1200x1200>' -strip -quality 82 -define webp:method=6 public/art/home/physics-gateway.webp
          ls -lh public/art/home/*.webp
      - name: Commit production artwork
        if: steps.existing.outputs.ready != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/art/home/*.webp
          git commit -m 'Vendor approved Home artwork as production WebP assets'
          git push
