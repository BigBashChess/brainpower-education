<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030a12">
  <meta name="description" content="Brainpower Education - interactive VCE Mathematics and Physics courses, practice, tests and free resources.">
  <title>Brainpower Education</title>
  <link rel="icon" href="public/brand/brainpower-logo.jpg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

  <!-- Canonical foundation, shared components and scoped route styles. -->
  <link rel="stylesheet" href="src/styles/revamp/tokens.css">
  <link rel="stylesheet" href="src/styles/revamp/base.css?v=pre1-finalisation">
  <link rel="stylesheet" href="src/styles/revamp/components.css">
  <link rel="stylesheet" href="src/styles/revamp/shell.css">
  <link rel="stylesheet" href="src/styles/revamp/home.css">
  <link rel="stylesheet" href="src/styles/revamp/learn.css">
  <link rel="stylesheet" href="src/styles/revamp/learn-route.css">
  <link rel="stylesheet" href="src/styles/revamp/course-overview.css">
  <link rel="stylesheet" href="src/styles/revamp/lesson.css">
  <link rel="stylesheet" href="src/styles/revamp/practice.css">
  <link rel="stylesheet" href="src/styles/revamp/assessment.css">
  <link rel="stylesheet" href="src/styles/revamp/art.css">
  <link rel="stylesheet" href="src/styles/revamp/exam-season.css">
  <link rel="stylesheet" href="src/styles/revamp/overlays.css">
  <link rel="stylesheet" href="src/styles/revamp/motion.css?v=pre1-finalisation">

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjs@14.6.0/lib/browser/math.js"></script>
  <script type="module" src="src/data/test-metadata-audit.js"></script>
  <script type="module" src="src/physics-register.js"></script>

  <script type="module" src="src/revamp/page-transitions.js"></script>
  <script type="module" src="src/main.js"></script>
  <script type="module" src="src/pre1-safety.js"></script>
  <script type="module" src="src/release-candidate.js"></script>
  <script type="module" src="src/mock-exams-2026.js"></script>
  <script type="module" src="src/revamp/runtime.js"></script>
  <script type="module" src="src/revamp/route-modules.js"></script>
  <script type="module" src="src/revamp/motion.js?v=pre1-finalisation"></script>
  <script type="module" src="src/revamp/update-log.js?v=pre1-finalisation"></script>
</head>
<body class="bp-revamp">
  <div id="app">
    <div class="bp-boot" role="status" aria-live="polite" aria-label="Loading Brainpower Education">
      <div class="bp-boot__inner bp-brainy-purposeful" data-brainy-state="focus">
        <img class="bp-boot__brainy" src="public/brand/brainy.svg" alt="">
        <div class="bp-boot__logo"><img src="public/brand/brainpower-logo.jpg" alt=""></div>
        <div class="bp-boot__title">Brainpower</div>
        <div class="bp-boot__sub">Education</div>
        <div class="bp-boot__message">Opening your study space…</div>
        <div class="bp-boot__track"><div class="bp-boot__bar"></div></div>
        <div class="bp-boot__micro"><span>Lessons</span><span>Practice</span><span>Assessments</span><span>Progress</span></div>
      </div>
    </div>
  </div>
  <noscript>Brainpower Education requires JavaScript for interactive features.</noscript>
</body>
</html>
